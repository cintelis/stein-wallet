name: CI and deploy

# Every push and pull request: build the wallet core, test it against the
# chain's reference values, type-check and build the site. On main (or by
# hand: Actions → CI and deploy → Run workflow) the built site is then
# deployed to Cloudflare and checked.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never two deploys at once; a newer push waits for the running one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

# As in stein-chain: third-party actions are avoided and first-party ones are
# pinned to a commit.

jobs:
  build:
    name: Checks, tests, build and deploy
    runs-on: ubuntu-latest
    env:
      SITE: https://wallet.steinchain.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Install the pinned compiler explicitly, with the WebAssembly target.
      - run: |
          version=$(sed -nE 's/^channel *= *"(.*)"$/\1/p' wasm/rust-toolchain.toml)
          rustup toolchain install "$version" --profile minimal \
            --component rustfmt,clippy --target wasm32-unknown-unknown
      - run: cargo fmt --check
        working-directory: wasm
      - run: cargo clippy --release --locked --target wasm32-unknown-unknown -- -D warnings
        working-directory: wasm
      # wrangler is pinned in package-lock.json; no third-party deploy action.
      - run: npm ci --no-audit --no-fund
      - run: npm run build:wasm
      - run: npm test
      - run: npm run typecheck
      - run: npx next build

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "the CLOUDFLARE_API_TOKEN secret is not set for this repository" >&2
            exit 1
          fi
          npx wrangler deploy

      # What is served must be what was built, with the security headers.
      # A query string unique to this run bypasses Cloudflare's edge cache.
      # A new version rolls out gradually, so back-to-back requests can be
      # answered by different versions: require three matches in a row.
      - name: Verify the deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          url="$SITE/stein_wallet_core.wasm?verify=$GITHUB_SHA-$GITHUB_RUN_ATTEMPT"
          streak=0
          for _ in $(seq 90); do
            if curl -fsS "$url" | cmp -s - out/stein_wallet_core.wasm; then streak=$((streak + 1)); else streak=0; fi
            [ "$streak" -ge 3 ] && break
            sleep 5
          done
          if [ "$streak" -lt 3 ]; then
            echo "the served wallet core did not settle on the built version within 7.5 minutes" >&2
            exit 1
          fi
          headers=$(curl -fsSI "$SITE/")
          grep -qi "^content-security-policy: default-src 'self'" <<<"$headers"
          grep -qi "^x-content-type-options: nosniff" <<<"$headers"
